name: IW6 FastFile retail header validation

on:
  push:
    branches:
      - iw6-fastfile-retail-probes
    paths:
      - .github/workflows/iw6-fastfile-retail.yml
      - tools/fastfile/**
  pull_request:
    paths:
      - .github/workflows/iw6-fastfile-retail.yml
      - tools/fastfile/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iw6-fastfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  header-survey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools/fastfile
          fetch-depth: 1
      - name: Regression-test IW6 unsigned and authenticated prefix parsers
        run: python3 tools/fastfile/probe_headers.py --test
      - name: Verify original FastFile headers, first authenticated SHA blocks and XFile prefixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iw6-source-headers
          : > /tmp/iw6-header-survey.jsonl
          while IFS=' ' read -r key expected; do
            [[ -n "$key" ]] || continue
            file="/tmp/iw6-source-headers/$key"
            headfile="/tmp/iw6-source-headers/$key.headers"
            url="https://r2.houseofkublai.com/ghosts/DUMP/$key"
            status="$(curl --fail --silent --show-error --location --retry 2 \
              --connect-timeout 15 --max-time 90 --range 0-65535 \
              --max-filesize 65536 --dump-header "$headfile" \
              --output "$file" --write-out '%{http_code}' "$url")"
            if [[ "$status" != 206 ]] || [[ "$(stat -c%s "$file")" != 65536 ]]; then
              echo "::error::Failed bounded initial range for $key (HTTP $status)" >&2
              exit 1
            fi
            count="$(python3 -c 'import struct,sys; print(struct.unpack_from("<I",open(sys.argv[1],"rb").read(28),24)[0])' "$file")"
            if (( count > 131072 )); then
              echo "::error::IW6 image table count $count exceeds cap for $key" >&2
              exit 1
            fi
            # Signed zones carry an 8192-byte authentication envelope,
            # 8192-byte SHA master block and one 8192-byte source block.
            # Unsigned zones need only an initial 8192-byte zlib prefix.
            magic="$(head -c 8 "$file")"
            base=$((44 + 24 * count))
            if [[ "$magic" == "IWff0100" ]]; then
              needed=$((base + 3 * 8192))
            else
              needed=$((base + 8192))
            fi
            if (( needed > 4194304 )); then
              echo "::error::IW6 prefix needs $needed bytes; cap exceeded" >&2
              exit 1
            fi
            if (( needed > 65536 )); then
              # Request the actual variable-length header, not the entire map.
              status="$(curl --fail --silent --show-error --location --retry 2 \
                --connect-timeout 15 --max-time 90 --range "0-$((needed - 1))" \
                --max-filesize 4194304 --dump-header "$headfile" \
                --output "$file" --write-out '%{http_code}' "$url")"
              if [[ "$status" != 206 ]] || [[ "$(stat -c%s "$file")" != "$needed" ]]; then
                echo "::error::Failed complete header range for $key (HTTP $status, need $needed bytes)" >&2
                exit 1
              fi
            fi
            remote_total="$(grep -i '^content-range:' "$headfile" | tail -n 1 | sed -E 's|.*\/([0-9]+).*|\1|' | tr -d '\r')"
            if [[ "$remote_total" != "$expected" ]]; then
              echo "::error::R2 source size differs for $key: $remote_total vs $expected" >&2
              exit 1
            fi
            python3 tools/fastfile/probe_headers.py "$file" \
              | tee -a /tmp/iw6-header-survey.jsonl
            rm -f "$file" "$headfile"
          done <<'SOURCE_FASTFILES'
          mp_alien_town.ff 186301740
          mp_alien_armory.ff 249387180
          mp_alien_beacon.ff 197856300
          mp_strikezone.ff 138884972
          black_ice.ff 333564502
          common_mp.ff 181589932
          common_core_mp.ff 163823660
          techsets_mp_alien_town.ff 7479340
          mp_alien_town_path.ff 385068
          SOURCE_FASTFILES
      - name: Upload diagnostic JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghosts-iw6-header-survey
          path: /tmp/iw6-header-survey.jsonl
          retention-days: 7
          if-no-files-found: warn
