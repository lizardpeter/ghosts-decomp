# What this repo reverses. Originals are never committed; they live in R2 under these keys
# and every tool verifies the sha256 before use.

project = "iw6"
title = "Call of Duty: Ghosts (PC, x64)"
graph = "re_iw6"
r2_public = "https://r2.houseofkublai.com/"
ghidra = "12.1.4"
compiler = "Store target: VS2019 16.11 (cl 19.29.30154), x64, LTCG. Servers and Steam exes: VS2012 (cl 17.00, Updates 2/4), x64"
# Original source roots, for turning PDB/MAP paths into repo paths (tools/pdb/extract.py). From the server PDBs;
# demonware, libs and speex sit beside src\ and are kept as <external>.
source_roots = ['c:\trees\iw6\code_source\src']

# kind: "retail" = the final target (the Microsoft Store build, reportedly without Arxan; R2 key pending upload).
#       "reference" = has symbols (PDB/MAP: the PC server build, Xbox 360 prototype MAPs), keys pending.
#       "related" = no symbols, but helpful: the Steam builds, which the community clients (iw6x-client, iw6-mod)
#       have named addresses for, so their names can be carried to the target by matching.
# `analyze = true` puts a build in the next Ghidra pipeline run (.github/workflows/ghidra.yml); a manual run can
# name any builds instead.
#
# `protection = "arxan"`: the code is encrypted on disk and decrypted by the entry stub at startup.
# tools/unpack/arxan.py emulates that stub and writes the decrypted image; Ghidra analyses that, never the
# raw file. `unpacked_sha256` pins the result, so the unpacked image is reproducible from the original.

# Final target: the Microsoft Store (GDK) build, package 38985CA0.CallofDutyGhostsPCMS 4.0.9.0 (docs/store-build.md).
# No Arxan, no Steam. Rebuilt with VS2019 16.11 (linker 14.29, cl 19.29.30154) in d:\workspace\outrun\iw6-depot;
# POGO debug record present (LTCG). Platform layer: GDK (xgameruntime.dll loaded at runtime, XUser, Xbox Live).
[[build]]
id = "iw6mp64_MSStore_ship"
kind = "retail"
analyze = true
timestamp = "2024-11-18T18:02:39Z"
pdb_path = 'd:\workspace\outrun\iw6-depot\iw6\game\pc\iw6mp64_MSStore_ship.pdb'
pdb_guid = "0A83874F-F6E2-4423-A596-766DECB765C4"
pdb_age = 4
exe = { key = "ghosts/DUMP/iw6mp64_MSStore_ship.exe", sha256 = "dd63cb5b81682f8764b0a0a7de65870188c22abf9900a1c2056e96ba27040757" }

